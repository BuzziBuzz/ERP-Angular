<div class="pila" role="status" aria-live="polite">
  @for (aviso of avisos.lista(); track aviso.id) {
    <div class="aviso" [class.error]="!aviso.ok">
      <span class="marca" aria-hidden="true">{{ aviso.ok ? '✓' : '!' }}</span>
      <p>{{ aviso.texto }}</p>
      <button type="button" (click)="avisos.cerrar(aviso.id)" aria-label="Cerrar aviso">✕</button>
    </div>
  }
</div>
